services:
  - type: web
    name: together-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_PARSE_APP_ID
        sync: false
      - key: VITE_PARSE_JS_KEY
        sync: false
      - key: VITE_PARSE_SERVER_URL
        value: https://parseapi.back4app.com/
